<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .surec{display:flex;flex-direction:column;gap:0;width:100%;margin-top:4px;}
  .surec-blok{border-radius:16px;padding:28px 36px;display:flex;flex-direction:column;gap:18px;text-align:left;}
  .surec-blok.ai{background:#fff;border:2.5px solid var(--aksan);}
  .surec-blok.sen{background:var(--aksan);}
  .surec-blok.sen .surec-rol,.surec-blok.sen .surec-adim{color:#fff;}
  .surec-rol{font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--aksan);}
  .surec-adim{font-size:30px;font-weight:600;line-height:1.35;color:var(--metin);}
  .surec-ok{text-align:center;font-size:27px;font-weight:700;color:var(--altin);}
  .surec-ok-orta{font-size:32px;margin:2px 0;}
  .surec-adim-liste{display:flex;flex-direction:column;gap:16px;}
  .surec-satir{display:flex;align-items:flex-start;gap:18px;}
  .surec-no{flex-shrink:0;width:42px;height:42px;border-radius:11px;background:var(--aksan);color:#fff;
    font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .surec-satir span:last-child{font-size:29px;font-weight:600;line-height:1.35;color:var(--metin);}
</style>
</head><body>
<div class="slayt tema-deniz">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">5/7</div>
  </div>

  <div class="govde">
    <div class="etiket">OTOMASYON ADAYI · 3/3</div>
    <h2>3. Doküman kontrolü</h2>
    <div class="surec">
      <div class="surec-blok sen">
        <div class="surec-rol">Sen</div>
        <div class="surec-adim">Kontrol kriterlerini bir kez tanımla.</div>
      </div>
      <div class="surec-ok surec-ok-orta">↓</div>
      <div class="surec-blok ai">
        <div class="surec-rol">Yapay zekâ</div>
        <div class="surec-adim-liste">
          <div class="surec-satir"><span class="surec-no">1</span><span>Dokümanı kriterlere göre kontrol etsin</span></div>
          <div class="surec-satir"><span class="surec-no">2</span><span>Eksikleri ve sorunlu noktaları işaretlesin</span></div>
          <div class="surec-satir"><span class="surec-no">3</span><span>Dokümanı son haline getirsin</span></div>
        </div>
      </div>
      <div class="surec-ok surec-ok-orta">↓</div>
      <div class="surec-blok sen">
        <div class="surec-rol">Sen</div>
        <div class="surec-adim">Değerlendir → düzelt → finalize et</div>
      </div>
    </div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">05 / 07</span></div>
</div>
</body></html>
