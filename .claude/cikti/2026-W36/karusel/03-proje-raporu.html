<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .surec{display:flex;flex-direction:column;gap:0;width:100%;margin-top:4px;}
  .surec-blok{border-radius:16px;padding:30px 36px;display:flex;flex-direction:column;gap:16px;text-align:left;}
  .surec-blok.ai{background:#fff;border:2.5px solid var(--aksan);}
  .surec-blok.sen{background:var(--aksan);}
  .surec-blok.sen .surec-rol,.surec-blok.sen .surec-adim{color:#fff;}
  .surec-rol{font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--aksan);}
  .surec-adim{font-size:31px;font-weight:600;line-height:1.38;color:var(--metin);}
  .surec-ok{text-align:center;font-size:28px;font-weight:700;color:var(--altin);}
  .surec-ok-orta{font-size:36px;margin:4px 0;}
</style>
</head><body>
<div class="slayt tema-deniz">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">3/7</div>
  </div>

  <div class="govde">
    <div class="etiket">OTOMASYON ADAYI · 1/3</div>
    <h2>1. Haftalık proje raporu</h2>
    <div class="surec">
      <div class="surec-blok ai">
        <div class="surec-rol">Yapay zekâ</div>
        <div class="surec-adim">Proje takip aracından tamamlanan, açık ve geciken işleri çeksin</div>
        <div class="surec-ok">↓</div>
        <div class="surec-adim">Toplantı notlarından güncellemeleri eklesin</div>
        <div class="surec-ok">↓</div>
        <div class="surec-adim">Haftalık raporu oluştursun</div>
      </div>
      <div class="surec-ok surec-ok-orta">↓</div>
      <div class="surec-blok sen">
        <div class="surec-rol">Sen</div>
        <div class="surec-adim">Kontrol et → düzelt → finalize et</div>
      </div>
    </div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">03 / 07</span></div>
</div>
</body></html>
