<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .govde.sik{gap:24px;}
  .rol-etiket{font-size:23px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--aksan);}
  .adim-liste{display:flex;flex-direction:column;gap:14px;width:100%;}
  .adim-kart{background:#fff;border:1px solid var(--cizgi);border-radius:13px;padding:20px 28px;
    display:flex;align-items:center;gap:22px;}
  .adim-no{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:var(--aksan);color:#fff;
    font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .adim-kart span:last-child{font-size:28px;font-weight:600;line-height:1.3;color:var(--metin);}
  .sen-kutu{background:var(--aksan);border-radius:13px;padding:22px 28px;
    display:flex;align-items:center;gap:22px;}
  .sen-kutu .sen-rol{color:#fff;font-size:23px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0;}
  .sen-kutu .sen-adim{color:#fff;font-size:29px;font-weight:700;}
</style>
</head><body>
<div class="slayt tema-deniz">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">5/7</div>
  </div>

  <div class="govde sik">
    <div class="etiket">OTOMASYON ADAYI · 3/3</div>
    <h2>3. Doküman kontrolü</h2>
    <div class="sen-kutu"><span class="sen-rol">Sen</span><span class="sen-adim">Kontrol kriterlerini bir kez tanımla.</span></div>
    <div class="rol-etiket">Yapay zekâ</div>
    <div class="adim-liste">
      <div class="adim-kart"><span class="adim-no">1</span><span>Dokümanı kriterlere göre kontrol etsin</span></div>
      <div class="adim-kart"><span class="adim-no">2</span><span>Eksikleri ve sorunlu noktaları işaretlesin</span></div>
      <div class="adim-kart"><span class="adim-no">3</span><span>Dokümanı son haline getirsin</span></div>
    </div>
    <div class="sen-kutu"><span class="sen-rol">Sen</span><span class="sen-adim">Değerlendir → düzelt → finalize et</span></div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">05 / 07</span></div>
</div>
</body></html>
