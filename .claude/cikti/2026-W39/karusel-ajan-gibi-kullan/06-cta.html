<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .govde .pill { align-self: flex-start; }
  .eylemler { display: flex; flex-direction: column; gap: 22px; width: 100%; }
  .eylem { display: flex; align-items: center; gap: 30px;
           background: #fff; border: 1px solid var(--cizgi); border-radius: 18px;
           padding: 26px 34px; }
  .eylem .kutu { width: 104px; height: 104px; flex-shrink: 0; border-radius: 22px;
                 background: var(--aksan-yumusak); display: flex;
                 align-items: center; justify-content: center; }
  .eylem .yazi .ad { font-family: 'Poppins', sans-serif; font-size: 40px;
                     font-weight: 700; color: var(--indigo); letter-spacing: -.01em; }
  .eylem .yazi .aciklama { font-size: 29px; font-weight: 500;
                           color: var(--soluk); line-height: 1.35; margin-top: 6px; }
  .kapanis { font-size: 31px; font-weight: 600; color: var(--metin); }
  .kapanis b { color: var(--aksan); }
</style>
</head><body>
<div class="slayt tema-mor">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">6/6</div>
  </div>

  <div class="govde">
    <h2>Pratik yapay zekâ ipuçları<br>burada <em>devam ediyor</em>.</h2>

    <div class="eylemler">
      <div class="eylem">
        <div class="kutu">
          <svg width="76" height="76" viewBox="0 0 76 76" fill="none">
            <path d="M14 10h32l14 14v42a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"
                  fill="#fff" stroke="#2E2266" stroke-width="4" stroke-linejoin="round"/>
            <path d="M46 10v14h14" stroke="#2E2266" stroke-width="4" stroke-linejoin="round"/>
            <path d="M20 38h22M20 50h16" stroke="#2E2266" stroke-width="4" stroke-linecap="round"/>
            <path d="M48 34h16v34l-8-7-8 7V34z" fill="#E0AE43" stroke="#2E2266"
                  stroke-width="4" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="yazi">
          <div class="ad">Kaydet</div>
          <div class="aciklama">Kendi ajanını kurarken adım adım geri dön.</div>
        </div>
      </div>

      <div class="eylem">
        <div class="kutu">
          <svg width="76" height="76" viewBox="0 0 76 76" fill="none">
            <path d="M10 16h44a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H30L18 62V52h-8a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z"

            <path d="M18 28h26M18 40h16" stroke="#2E2266" stroke-width="4" stroke-linecap="round"/>
            <path d="M70 30 44 44l8 4 4 10 14-28z" fill="#6C3FE4" stroke="#2E2266"
                  stroke-width="4" stroke-linejoin="round"/>
            <path d="M52 48l8-12" stroke="#2E2266" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="yazi">
          <div class="ad">Paylaş</div>
          <div class="aciklama">Bu akışa ihtiyacı olan birini tanıyorsun.</div>
        </div>
      </div>

      <div class="eylem">
        <div class="kutu">
          <svg width="76" height="76" viewBox="0 0 76 76" fill="none">
            <rect x="8" y="12" width="52" height="52" rx="10"
                  fill="#fff" stroke="#2E2266" stroke-width="4"/>
            <circle cx="34" cy="32" r="9" fill="#EDE7FC" stroke="#2E2266" stroke-width="4"/>
            <path d="M20 54c2-8 7-12 14-12s12 4 14 12" stroke="#2E2266"
                  stroke-width="4" stroke-linecap="round"/>
            <circle cx="60" cy="54" r="13" fill="#E0AE43" stroke="#2E2266" stroke-width="4"/>
            <path d="M60 48v12M54 54h12" stroke="#2E2266" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="yazi">
          <div class="ad">Takip et</div>
          <div class="aciklama">Her hafta işe yarayan bir iş akışı daha.</div>
        </div>
      </div>
    </div>

    <div class="kapanis">Sıradaki ajanı <b>birlikte kuralım.</b></div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">06 / 06</span></div>
</div>
</body></html>
