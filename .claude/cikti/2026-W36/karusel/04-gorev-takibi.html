<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .rol-etiket{font-size:25px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--aksan);}
  .adim-liste{display:flex;flex-direction:column;gap:16px;width:100%;}
  .adim-kart{background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:26px 32px;
    display:flex;align-items:center;gap:26px;}
  .adim-no{flex-shrink:0;width:52px;height:52px;border-radius:14px;background:var(--aksan);color:#fff;
    font-size:25px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .adim-kart span:last-child{font-size:31px;font-weight:600;line-height:1.32;color:var(--metin);}
  .sen-kutu{background:var(--aksan);border-radius:14px;padding:28px 32px;
    display:flex;align-items:center;gap:24px;margin-top:6px;}
  .sen-kutu .sen-rol{color:#fff;font-size:25px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;flex-shrink:0;}
  .sen-kutu .sen-adim{color:#fff;font-size:33px;font-weight:700;}
</style>
</head><body>
<div class="slayt tema-deniz">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">4/7</div>
  </div>

  <div class="govde">
    <div class="etiket">OTOMASYON ADAYI · 2/3</div>
    <h2>2. Haftalık görev takibi</h2>
    <div class="rol-etiket">Yapay zekâ</div>
    <div class="adim-liste">
      <div class="adim-kart"><span class="adim-no">1</span><span>Görev takip aracından açık işleri ve deadline'ları çeksin</span></div>
      <div class="adim-kart"><span class="adim-no">2</span><span>Bu haftanın işlerini ve gecikenleri ayırsın</span></div>
      <div class="adim-kart"><span class="adim-no">3</span><span>Önceliklendirilmiş listeyi hazırlasın</span></div>
    </div>
    <div class="sen-kutu"><span class="sen-rol">Sen</span><span class="sen-adim">Öncelikleri kontrol et → planını finalize et</span></div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">04 / 07</span></div>
</div>
</body></html>
