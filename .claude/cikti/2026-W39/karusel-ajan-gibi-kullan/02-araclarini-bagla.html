<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .govde .pill { align-self: flex-start; }
  .govde.ust { padding-top: 8px; gap: 26px; }
  .pencere { width: 660px; border: 1px solid var(--cizgi); border-radius: 16px;
             overflow: hidden; background: #fff; }
  .pencere .cubuk { height: 54px; background: #F3F1EE; border-bottom: 1px solid var(--cizgi);
                    display: flex; align-items: center; gap: 12px; padding: 0 24px; }
  .pencere .nokta { width: 15px; height: 15px; border-radius: 50%; background: #D7D3CC; }
  .pencere img { width: 100%; display: block; }
  .yonerge { font-weight: 700; color: var(--metin); }
  .yol { display: flex; align-items: center; gap: 16px; }
  .yol .ok { color: var(--altin); font-size: 30px; font-weight: 700; }
</style>
</head><body>
<div class="slayt tema-mor">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">2/5</div>
  </div>
  <div class="dev-numara">01</div>

  <div class="govde ust">
    <span class="pill dolu">Adım 1</span>
    <h2>Araçlarını bağla.</h2>
    <p>Diyelim ki, her sabah e-postalarını kontrol edip yanıt taslakları hazırlayan
       bir ajan oluşturmak istiyorsun.</p>
    <p class="yonerge">Plugins altında Gmail'ini bağla.</p>
    <div class="yol">
      <span class="pill yumusak">Plugins</span>
      <span class="ok">→</span>
      <span class="pill yumusak">Gmail</span>
    </div>
    <div class="pencere">
      <div class="cubuk"><span class="nokta"></span><span class="nokta"></span><span class="nokta"></span></div>
      <img src="../../../assets/ekran/plugins-gmail.png" alt="Plugins ayarları — Gmail">
    </div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">02 / 05</span></div>
</div>
</body></html>
