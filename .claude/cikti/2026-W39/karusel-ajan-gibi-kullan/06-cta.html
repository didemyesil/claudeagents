<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .kaydet-ikon { width: 150px; height: 150px; border-radius: 34px;
                 background: var(--aksan-yumusak);
                 display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 66px; line-height: 1.16; }
  .adim-serit { display: flex; align-items: center; gap: 12px; }
  .adim { display: flex; align-items: center; gap: 14px;
          background: #fff; border: 1px solid var(--cizgi); border-radius: 999px;
          padding: 14px 22px 14px 14px; }
  .adim .no { width: 38px; height: 38px; border-radius: 50%;
              background: var(--aksan); color: #fff;
              font-family: 'Poppins', sans-serif; font-size: 23px; font-weight: 700;
              display: flex; align-items: center; justify-content: center; }
  .adim .ad { font-family: 'Poppins', sans-serif; font-size: 26px;
              font-weight: 600; color: var(--indigo); }
</style>
</head><body>
<div class="slayt tema-mor">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">6/6</div>
  </div>

  <div class="govde">
    <div class="kaydet-ikon">
      <svg width="104" height="104" viewBox="0 0 76 76" fill="none">
        <path d="M14 10h32l14 14v42a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"
              fill="#fff" stroke="#2E2266" stroke-width="4" stroke-linejoin="round"/>
        <path d="M46 10v14h14" stroke="#2E2266" stroke-width="4" stroke-linejoin="round"/>
        <path d="M20 38h22M20 50h16" stroke="#2E2266" stroke-width="4" stroke-linecap="round"/>
        <path d="M48 34h16v34l-8-7-8 7V34z" fill="#E0AE43" stroke="#2E2266"
              stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Yapay zekâyla kendi çalışma sistemini kurmak için bu <em>4 adımı kaydet</em>.</h1>

    <div class="adim-serit">
      <div class="adim"><span class="no">1</span><span class="ad">Bağla</span></div>
      <div class="adim"><span class="no">2</span><span class="ad">Tanımla</span></div>
      <div class="adim"><span class="no">3</span><span class="ad">Zamanla</span></div>
      <div class="adim"><span class="no">4</span><span class="ad">Test et</span></div>
    </div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">06 / 06</span></div>
</div>
</body></html>
