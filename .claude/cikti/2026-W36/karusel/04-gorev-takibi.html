<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .surec{display:flex;flex-direction:column;gap:0;width:100%;margin-top:6px;}
  .surec-blok{border-radius:16px;padding:34px 38px;display:flex;flex-direction:column;gap:22px;text-align:left;}
  .surec-blok.ai{background:#fff;border:2.5px solid var(--aksan);}
  .surec-blok.sen{background:var(--aksan);}
  .surec-blok.sen .surec-rol,.surec-blok.sen .surec-adim{color:#fff;}
  .surec-rol{font-size:25px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--aksan);}
  .surec-adim{font-size:33px;font-weight:600;line-height:1.38;color:var(--metin);}
  .surec-ok{text-align:center;font-size:30px;font-weight:700;color:var(--altin);}
  .surec-ok-orta{font-size:38px;margin:6px 0;}
  .surec-adim-liste{display:flex;flex-direction:column;gap:20px;}
  .surec-satir{display:flex;align-items:flex-start;gap:20px;}
  .surec-no{flex-shrink:0;width:46px;height:46px;border-radius:12px;background:var(--aksan);color:#fff;
    font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}
  .surec-satir span:last-child{font-size:31px;font-weight:600;line-height:1.38;color:var(--metin);}
</style>
</head><body>
<div class="slayt tema-deniz">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">4/7</div>
  </div>

  <div class="govde">
    <div class="etiket">OTOMASYON ADAYI · 2/3</div>
    <h2>2. Haftalık görev takibi</h2>
    <div class="surec">
      <div class="surec-blok ai">
        <div class="surec-rol">Yapay zekâ</div>
        <div class="surec-adim-liste">
          <div class="surec-satir"><span class="surec-no">1</span><span>Görev takip aracından açık işleri ve deadline'ları çeksin</span></div>
          <div class="surec-satir"><span class="surec-no">2</span><span>Bu haftanın işlerini ve gecikenleri ayırsın</span></div>
          <div class="surec-satir"><span class="surec-no">3</span><span>Önceliklendirilmiş listeyi hazırlasın</span></div>
        </div>
      </div>
      <div class="surec-ok surec-ok-orta">↓</div>
      <div class="surec-blok sen">
        <div class="surec-rol">Sen</div>
        <div class="surec-adim">Öncelikleri kontrol et → planını finalize et</div>
      </div>
    </div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">04 / 07</span></div>
</div>
</body></html>
