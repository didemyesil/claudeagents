<!doctype html><html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../templates/brand.css">
<style>
  .govde .pill { align-self: flex-start; }
  .govde { gap: 30px; }
  .sohbet { width: 100%; background: #fff; border: 1px solid var(--cizgi);
            border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 26px; }
  .sohbet .cubuk { display: flex; align-items: center; gap: 12px; }
  .sohbet .nokta { width: 14px; height: 14px; border-radius: 50%; background: #E0DDD6; }
  .mesaj { align-self: flex-end; max-width: 92%;
           background: var(--lila); color: var(--indigo);
           font-size: 34px; line-height: 1.5; font-weight: 600;
           padding: 28px 34px; border-radius: 22px 22px 6px 22px; }
  .mesaj .saat { color: var(--aksan); font-weight: 700; }
  .girdi { display: flex; align-items: center; justify-content: space-between; gap: 20px;
           border: 2px solid var(--cizgi); border-radius: 999px; padding: 18px 20px 18px 30px; }
  .girdi span { font-size: 29px; font-weight: 600; color: var(--soluk); }
  .girdi .gonder { width: 58px; height: 58px; border-radius: 50%; background: var(--aksan);
                   color: #fff; font-size: 30px; font-weight: 700;
                   display: flex; align-items: center; justify-content: center; }
</style>
</head><body>
<div class="slayt tema-deniz">
  <div class="ilerleme">
    <div class="cizgiler"><div class="c1"></div><div class="c2"></div></div>
    <div class="rozet">4/5</div>
  </div>
  <div class="dev-numara">03</div>

  <div class="govde">
    <span class="pill dolu">Adım 3</span>
    <h2>Zamanlı görev tanımla.</h2>
    <p>Bunun her gün aynı saatte çalışmasını istersen <b class="vurgu">zamanlı görev</b> oluştur.
       Aynı sohbette şunu yaz:</p>
    <div class="sohbet">
      <div class="cubuk"><span class="nokta"></span><span class="nokta"></span><span class="nokta"></span></div>
      <div class="mesaj"><span class="saat">Her sabah 09.00'da</span> yanıtsız e-postalarımı
        kontrol et. Skill'imi kullanarak yanıt taslakları hazırla ve bana sun.</div>
      <div class="girdi"><span>Mesaj yaz…</span><span class="gonder">↑</span></div>
    </div>
  </div>

  <div class="alt"><span>Grow with Tech</span><span class="sayfa">04 / 05</span></div>
</div>
</body></html>
